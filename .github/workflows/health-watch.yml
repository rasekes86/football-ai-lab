name: Vigilar salud de Football AI Lab
on:
  workflow_run:
    workflows:
      - "Analisis futbol diario"
      - "Refresco escalonado de cuotas"
    types: [completed]
    branches: [main]
  # La ronda programada lee archivos existentes, NUNCA consulta APIs de cuotas.
  schedule:
    - cron: '21 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-ai-health
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar el monitor sin red
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_health_monitor.py' -v
      - name: Comprobar artefactos y alertar Telegram (sin consultar cuotas)
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTH_ALERTS_ENABLED: ${{ vars.HEALTH_ALERTS_ENABLED || 'true' }}
          FREE_ODDS_ENABLED: ${{ vars.ENABLE_FREE_ODDS || 'false' }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
        run: python -m football_ai_lab.health_monitor
      - name: Conservar auditoría y evitar avisos repetidos
        if: always()
        run: |
          if [ ! -f output/estado_salud.json ]; then
            echo "Sin comprobación completada: no existe estado que guardar."
            exit 0
          fi
          cp output/estado_salud.json /tmp/football-ai-health.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/football-ai-health.json output/estado_salud.json
            git add output/estado_salud.json
            if git diff --cached --quiet; then
              echo "Estado de salud sin cambios."
              exit 0
            fi
            git commit -m 'Guarda estado del monitor de salud [skip ci]'
            if git push origin HEAD:main; then
              echo "Estado de salud persistido sin credenciales."
              exit 0
            fi
            echo "Cambio concurrente; reconciliando sobre main (intento $attempt de 3)."
          done
          echo "::error::No se pudo guardar el estado tras tres intentos."
          exit 1
