name: Inspección temporal de campos ESPN fútbol
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-soccer-stats.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Comprobar nombres originales de estadísticas de dos partidos públicos
        run: |
          python - <<'PY'
          import json,urllib.request
          events=[("Premier Chelsea Leeds","eng.1","401879236"),("LaLiga Sevilla Betis","esp.1","401882797")]
          for name,league,event in events:
              url=f"https://site.api.espn.com/apis/site/v2/sports/soccer/{league}/summary?event={event}"
              try:
                  raw=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"FootballAILab/0.1"}),timeout=12).read()
                  info=json.loads(raw)
                  print("EVENTO",name,"ID",event)
                  for team in (info.get("boxscore") or {}).get("teams") or []:
                      print("EQUIPO",(team.get("team") or {}).get("displayName"))
                      for stat in team.get("statistics") or []:
                          print("CAMPO",stat.get("name"),"=",stat.get("displayValue"),"alias",stat.get("abbreviation"))
              except Exception as exc:
                  print("ERROR",name,type(exc).__name__,str(exc)[:250])
          PY
