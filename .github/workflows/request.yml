name: Análisis de fútbol desde ChatGPT
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  consultar:
    if: (startsWith(github.event.issue.title, '[ANALISIS]') || startsWith(github.event.issue.title, '[DIRECTO]')) && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar motor
        run: python -m pip install -e .
      - name: Consulta validada por título
        env:
          ENABLE_INFERSPORTS: '1'
        run: python -m football_ai_lab.query --event-path "$GITHUB_EVENT_PATH" --out /tmp/football-reply.md
      - name: Responder en GitHub Issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file /tmp/football-reply.md
