name: Validación XGBoost semanal (sin apuestas)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/football_ai_lab/ml.py"
      - "tests/test_ml.py"
      - "pyproject.toml"
      - ".github/workflows/ml.yml"
  schedule:
    - cron: '43 6 * * 1'
permissions:
  contents: write
concurrency:
  group: football-ai-daily
  cancel-in-progress: false
jobs:
  ml-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependencia ML gratuita
        run: python -m pip install -e '.[ml]'
      - name: Verificar pruebas unitarias
        run: python -m unittest discover -s tests -v
      - name: Entrenar y validar fuera de muestra temporal
        run: python -m football_ai_lab.ml --days 14
      - name: Publicar métricas y predicciones experimentales
        run: |
          tar -cf /tmp/football-ml.tar output_ml/validacion.json output_ml/predicciones_ml.csv
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- src tests .github pyproject.toml; then
            echo "El código cambió mientras se entrenaba; se omite publicación obsoleta."
            exit 0
          fi
          git reset --hard origin/main
          tar -xf /tmp/football-ml.tar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output_ml/validacion.json output_ml/predicciones_ml.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Evalúa XGBoost cronológicamente [skip ci]'
            git push
          fi
