name: Pruebas · Verificación manual Telegram
on:
  pull_request:
    paths:
      - 'src/football_ai_lab/verify_results.py'
      - 'tests/test_verify_results_manual.py'
      - 'telegram-bot/**'
      - '.github/workflows/verify-results.yml'
      - '.github/workflows/verify-feature-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/football_ai_lab/verify_results.py'
      - 'tests/test_verify_results_manual.py'
      - 'telegram-bot/**'
      - '.github/workflows/verify-feature-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Compilar liquidador
        run: python -m py_compile src/football_ai_lab/verify_results.py
      - name: Probar liquidaciones sin tocar históricos
        run: python -m unittest discover -s tests -p 'test_verify_results_manual.py' -v
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis
        run: |
          node --check telegram-bot/src/index.mjs
          node --check telegram-bot/src/logic.mjs
      - name: Pruebas de autorización y menú
        working-directory: telegram-bot
        run: npm test
