name: Comprobación del panel web

on:
  pull_request:
    paths:
      - "site/**"
      - "tests/test_performance_breakdown.mjs"
      - ".github/workflows/site-tests.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/test_performance_breakdown.mjs"
      - ".github/workflows/site-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-league-statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxis de módulos
        run: |
          node --check site/app.js
          node --check site/performance.mjs
          node --check site/performance_breakdown.mjs
      - name: Verificar estadísticas diarias y por liga
        run: node --test tests/test_performance_breakdown.mjs
