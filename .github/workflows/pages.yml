name: Publicar Football AI Lab Dashboard
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'output/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # Daily uses GITHUB_TOKEN to commit output; that push cannot start
  # another push workflow. workflow_run explicitly handles daily updates.
  workflow_run:
    workflows: ['Analisis futbol diario', 'Refresco escalonado de cuotas']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: football-ai-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar código JS
        run: |
          node --check site/data.mjs
          node --check site/app.js
          node --check site/home.mjs
          node --check site/match_detail.mjs
          node --check site/results_mobile.mjs
          node --check site/feed_loader.mjs
          node --check site/pwa.js
          node --check site/sw.js
      - name: Pruebas de CSV, histórico y simulación
        run: node --test site/tests/*.test.mjs
      - name: Comprobar fuentes de publicación
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          out=Path('output')
          required = {
            'predicciones.csv': {'id','liga','fecha_utc','local','visitante'},
            'calendario_partidos.csv': {'id','liga','fecha_utc','local','visitante','primera_captura_utc'},
            'historico_predicciones.csv': {'id','fecha_analisis_utc'},
            'selecciones.csv': {'id','seleccion','mercado','probabilidad'},
            'historico_selecciones.csv': {'id','clave','archivado_utc'},
            'seguimiento_selecciones.csv': {'id','clave','resultado','estado'},
            'seguimiento.csv': {'id','estado','resultado_real'},
            'seguimiento_oportunidades_150.csv': {'id','estado','retorno_simulado_unidad'},
            'seguimiento_adicionales_teoricas.csv': {'id','estado','probabilidad','tipo_cuota'},
          }
          for name, fields in required.items():
              with (out/name).open(newline='',encoding='utf-8-sig') as f:
                  header=set(next(csv.reader(f)))
                  assert fields<=header, f'{name}: missing {fields-header}'
          for name in ('evaluacion_selecciones.json','evaluacion_oportunidades_150.json','evaluacion_real.json'):
              json.loads((out/name).read_text(encoding='utf-8'))
          for name in ('index.html','styles.css','app.js','data.mjs'):
              assert (Path('site')/name).is_file(),name
          print('CSV, JSON y assets de la web verificados.')
          PY
      - name: Probar identificación y ambigüedades de escudos
        run: python -m unittest discover -s site/tests -p 'test_*.py' -v
      - name: Generar escudos de los seis campeonatos
        run: python site/scripts/build_crests.py
      - name: Generar iconos de Android sin dependencias
        run: |
          python site/scripts/build_pwa_icons.py
          python - <<'PY'
          import json, struct
          from pathlib import Path
          manifest=json.loads(Path("site/manifest.webmanifest").read_text(encoding="utf-8"))
          assert manifest["start_url"]=="./#home"
          assert manifest["scope"]=="./"
          for size in (192,512):
              icon=Path(f"site/icon-{size}.png").read_bytes()
              assert icon.startswith(b"\x89PNG\r\n\x1a\n")
              assert struct.unpack(">II",icon[16:24])==(size,size)
          assert Path("site/sw.js").is_file()
          print("Manifiesto, service worker e iconos 192/512 validados.")
          PY
      - name: Publicar datos públicos junto a la PWA
        run: |
          python site/scripts/publish_feeds.py
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'site/scripts')
          from publish_feeds import FILES
          out = Path('site/published')
          assert len(FILES) == 19
          assert all((out / name).is_file() for name in FILES)
          print('Los 19 feeds estarán disponibles en el mismo dominio de GitHub Pages.')
          PY
      - name: Preparar sitio
        run: |
          touch site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      # GitHub puede tardar unos segundos en indexar el artefacto recién
      # subido; sin este margen deploy-pages devuelve falsamente 0 artefactos.
      - name: Esperar indexación del artefacto de Pages
        run: sleep 12
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
