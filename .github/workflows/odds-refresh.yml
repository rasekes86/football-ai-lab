name: Refresco escalonado de cuotas
on:
  # Permite adelantar una ronda mediante cambios explícitos en este workflow.
  # Los commits de datos no vuelven a lanzarlo (evita bucles y gastar API).
  push:
    branches: [main]
    paths: ['.github/workflows/odds-refresh.yml']
  schedule:
    - cron: '43 */2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/football_ai_lab/**'
      - 'tests/**'
      - 'site/**'
      - '.github/workflows/odds-refresh.yml'
permissions:
  contents: write
concurrency:
  group: football-ai-daily
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar proyecto
        run: python -m pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar modelo y cuotas con datos de prueba, sin APIs
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/football-python-tests.log
      - name: Verificar los módulos de la web y las adicionales
        run: |
          set -o pipefail
          (node --check site/data.mjs && node --check site/match_detail.mjs && node --test site/tests/*.test.mjs) 2>&1 | tee /tmp/football-node-tests.log
      - name: Diagnóstico temporal de pruebas fallidas
        if: ${{ failure() && github.event_name != 'pull_request' }}
        run: |
          git fetch origin main
          git reset --hard origin/main
          mkdir -p output
          {
            echo "Refresco escalonado de cuotas — diagnóstico de pruebas"
            echo "Ejecutado: $(date -u +%FT%TZ)"
            for file in /tmp/football-python-tests.log /tmp/football-node-tests.log; do
              if [ -s "$file" ]; then
                echo "=== $file ==="
                tail -n 100 "$file"
              fi
            done
          } > output/diagnostico_tests_cuotas.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/diagnostico_tests_cuotas.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Captura diagnóstico temporal de pruebas del refresco [skip ci]'
            git push
          fi
  refresh:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar proyecto
        run: python -m pip install -e .
      - name: Refrescar cuotas solo de partidos sin adicional
        env:
          ENABLE_FREE_ODDS: ${{ vars.ENABLE_FREE_ODDS || 'false' }}
          FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
          ENABLE_FIVE_SEGUNDA: ${{ vars.ENABLE_FIVE_SEGUNDA || 'false' }}
          FREE_ODDS_MAX_FIXTURES: '35'
          FREE_ODDS_HOURLY_BUDGET: ${{ vars.FREE_ODDS_HOURLY_BUDGET || '48' }}
          ENABLE_API_FOOTBALL_ODDS: 'false'
          ENABLE_REAL_ODDS: 'false'
        run: python -m football_ai_lab.odds_refresh
      - name: Publicar únicamente cuotas y adicionales
        run: |
          if [ ! -f output/estado_consultas_cuotas.json ]; then
            echo "Sin cuotas activadas; no hay archivos nuevos."
            exit 0
          fi
          tar -cf /tmp/football-odds.tar output/cuotas_reales_verificadas.json output/comparacion_cuotas_reales.json output/historico_cuotas_reales.json output/estado_consultas_cuotas.json output/historico_oportunidades_150.csv output/seguimiento_oportunidades_150.csv output/evaluacion_oportunidades_150.json output/oportunidades_150.md
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- src tests data .github pyproject.toml; then
            echo "Hubo cambios de código durante la consulta: no se publica un estado obsoleto."
            exit 0
          fi
          git reset --hard origin/main
          tar -xf /tmp/football-odds.tar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/cuotas_reales_verificadas.json output/comparacion_cuotas_reales.json output/historico_cuotas_reales.json output/estado_consultas_cuotas.json output/historico_oportunidades_150.csv output/seguimiento_oportunidades_150.csv output/evaluacion_oportunidades_150.json output/oportunidades_150.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresca cuotas pendientes sin modificar cuotas congeladas [skip ci]'
            git push
          fi
