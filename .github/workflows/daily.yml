name: Analisis futbol diario
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'pyproject.toml'
      - '.github/workflows/daily.yml'
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: write
concurrency:
  group: football-ai-daily
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar proyecto
        run: python -m pip install -e .
      - name: Instalar contexto Machina Sports gratuito
        run: python -m pip install 'sports-skills==0.40.5'
        continue-on-error: true
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Verificar scripts externos con datos ficticios (sin API real)
        env:
          INFERSPORTS_MOCK: '1'
        run: |
          python .agents/skills/predicting-football-matches/scripts/match_model.py --help
          bash .agents/skills/infersports/scripts/today.sh --limit 3
      - name: Ejecutar análisis
        env:
          ENABLE_INFERSPORTS: '1'
          ENABLE_MACHINA: '1'
          ENABLE_HISTORIC_XG: '1'
          ENABLE_PLAYER_SAMPLE: '1'
        run: python -m football_ai_lab.pipeline --days 14 --backtest-games 120
      - name: Guardar resultados derivados
        run: |
          tar -cf /tmp/football-out.tar output/predicciones.csv output/historico_predicciones.csv output/seguimiento.csv output/informe.md output/mercados.csv output/backtest.csv output/backtest_resumen.json output/estado_agentes.json output/contexto_machina.json output/contexto_partidos.json output/evaluacion_real.json output/contexto_xg.json output/selecciones.json output/selecciones.csv output/validacion_conteos.json output/jugadores_historico.json output/cobertura_jugadores.json output/historico_selecciones.csv output/seguimiento_selecciones.csv output/evaluacion_selecciones.json output/informes_partidos.json output/informes_partidos.md output/historico_oportunidades_150.csv output/seguimiento_oportunidades_150.csv output/evaluacion_oportunidades_150.json output/oportunidades_150.md output/estadisticas_finales_verificadas.json output/desglose_postpartido.json output/mercados_historicos.json output/pronosticos_mercados_futuros.json output/radar_contexto_equipos.json output/fiabilidad_mercados_futuros.json output/seguimiento_mercados_futuros.csv output/historico_mercados_futuros.csv
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- src tests data .github pyproject.toml; then
            echo "El código cambió mientras se calculaba; se omite una publicación obsoleta."
            exit 0
          fi
          git reset --hard origin/main
          tar -xf /tmp/football-out.tar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/predicciones.csv output/historico_predicciones.csv output/seguimiento.csv output/informe.md output/mercados.csv output/backtest.csv output/backtest_resumen.json output/estado_agentes.json output/contexto_machina.json output/contexto_partidos.json output/evaluacion_real.json output/contexto_xg.json output/selecciones.json output/selecciones.csv output/validacion_conteos.json output/jugadores_historico.json output/cobertura_jugadores.json output/historico_selecciones.csv output/seguimiento_selecciones.csv output/evaluacion_selecciones.json output/informes_partidos.json output/informes_partidos.md output/historico_oportunidades_150.csv output/seguimiento_oportunidades_150.csv output/evaluacion_oportunidades_150.json output/oportunidades_150.md output/estadisticas_finales_verificadas.json output/desglose_postpartido.json output/mercados_historicos.json output/pronosticos_mercados_futuros.json output/radar_contexto_equipos.json output/fiabilidad_mercados_futuros.json output/seguimiento_mercados_futuros.csv output/historico_mercados_futuros.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiza pronósticos y seguimiento [skip ci]'
            git push
          fi
      - name: Alertas Fase 7 por Telegram
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALERTS_ENABLED: ${{ vars.TELEGRAM_ALERTS_ENABLED }}
          TELEGRAM_ALERT_MARKETS: ${{ vars.TELEGRAM_ALERT_MARKETS }}
          TELEGRAM_ALERT_LEAGUES: ${{ vars.TELEGRAM_ALERT_LEAGUES }}
          TELEGRAM_ALERT_MIN_PROBABILITY: ${{ vars.TELEGRAM_ALERT_MIN_PROBABILITY }}
          TELEGRAM_ALERT_QUALITY: ${{ vars.TELEGRAM_ALERT_QUALITY }}
          TELEGRAM_ALERT_HORIZON_HOURS: ${{ vars.TELEGRAM_ALERT_HORIZON_HOURS }}
          TELEGRAM_ALERT_RESULTS_DAYS: ${{ vars.TELEGRAM_ALERT_RESULTS_DAYS }}
          TELEGRAM_ALERT_MAX_UPCOMING: ${{ vars.TELEGRAM_ALERT_MAX_UPCOMING }}
          TELEGRAM_ALERT_MAX_RESULTS: ${{ vars.TELEGRAM_ALERT_MAX_RESULTS }}
        run: python -m football_ai_lab.telegram_alerts
      - name: Guardar estado de alertas sin secretos
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if test -f output/estado_alertas_telegram.json; then
            git add output/estado_alertas_telegram.json
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Guarda control anti duplicados Telegram [skip ci]'
              git push
            fi
          else
            echo 'Telegram no activado o sin mensaje confirmado: sin estado.'
          fi
