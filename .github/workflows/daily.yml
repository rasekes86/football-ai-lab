name: Analisis futbol diario
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/daily.yml'
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: write
concurrency:
  group: football-ai-daily
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar proyecto
        run: python -m pip install -e .
      - name: Instalar contexto Machina Sports gratuito
        run: python -m pip install 'sports-skills==0.40.5'
        continue-on-error: true
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Verificar scripts externos con datos ficticios (sin API real)
        env:
          INFERSPORTS_MOCK: '1'
        run: |
          python .agents/skills/predicting-football-matches/scripts/match_model.py --help
          bash .agents/skills/infersports/scripts/today.sh --limit 3
      - name: Ejecutar análisis
        env:
          ENABLE_INFERSPORTS: '1'
          ENABLE_MACHINA: '1'
          ENABLE_HISTORIC_XG: '1'
          ENABLE_PLAYER_SAMPLE: '1'
        run: python -m football_ai_lab.pipeline --days 14 --backtest-games 120
      - name: Guardar resultados derivados
        run: |
          tar -cf /tmp/football-out.tar output/predicciones.csv output/historico_predicciones.csv output/seguimiento.csv output/informe.md output/mercados.csv output/backtest.csv output/backtest_resumen.json output/estado_agentes.json output/contexto_machina.json output/contexto_partidos.json output/evaluacion_real.json output/contexto_xg.json output/selecciones.json output/selecciones.csv output/validacion_conteos.json output/jugadores_historico.json output/cobertura_jugadores.json output/historico_selecciones.csv output/seguimiento_selecciones.csv output/evaluacion_selecciones.json output/informes_partidos.json output/informes_partidos.md
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- src tests .github pyproject.toml; then
            echo "El código cambió mientras se calculaba; se omite una publicación obsoleta."
            exit 0
          fi
          git reset --hard origin/main
          tar -xf /tmp/football-out.tar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/predicciones.csv output/historico_predicciones.csv output/seguimiento.csv output/informe.md output/mercados.csv output/backtest.csv output/backtest_resumen.json output/estado_agentes.json output/contexto_machina.json output/contexto_partidos.json output/evaluacion_real.json output/contexto_xg.json output/selecciones.json output/selecciones.csv output/validacion_conteos.json output/jugadores_historico.json output/cobertura_jugadores.json output/historico_selecciones.csv output/seguimiento_selecciones.csv output/evaluacion_selecciones.json output/informes_partidos.json output/informes_partidos.md
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiza pronósticos y seguimiento [skip ci]'
            git push
          fi
      - name: Enviar resumen opcional por Telegram
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m football_ai_lab.telegram_notify
