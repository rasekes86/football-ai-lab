name: Analisis futbol diario
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/daily.yml'
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: write
concurrency:
  group: football-ai-daily
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar proyecto
        run: python -m pip install -e .
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Verificar scripts externos con datos ficticios (sin API real)
        env:
          INFERSPORTS_MOCK: '1'
        run: |
          python .agents/skills/predicting-football-matches/scripts/match_model.py --help
          bash .agents/skills/infersports/scripts/today.sh --limit 3
      - name: Ejecutar análisis
        env:
          ENABLE_INFERSPORTS: '1'
        run: python -m football_ai_lab.pipeline --days 14 --backtest-games 120
      - name: Guardar resultados derivados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/predicciones.csv output/historico_predicciones.csv output/seguimiento.csv output/informe.md output/mercados.csv output/backtest.csv output/backtest_resumen.json output/estado_agentes.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiza pronósticos y seguimiento [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push
          fi
