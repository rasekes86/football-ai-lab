[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-ai-lab"
version = "0.3.0"
description = "Investigación estadística de fútbol con fuentes gratuitas"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = ["xgboost>=2.1,<4","scikit-learn>=1.5,<2"]

[tool.setuptools.packages.find]
where = ["src"]
